<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Accedi — SopravvivenzaAI</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="ambient"><span></span><span></span><span></span></div>
<div class="auth-wrapper">
  <div class="auth-box">
    <div class="auth-icon">👋</div>
    <h2>Bentornato!</h2>
    <p class="auth-sub">Accedi al tuo account per salvare le risposte dell'IA e chattare con l'agente 🤖</p>
    <input class="auth-input" type="email"    id="email" placeholder="La tua email" autocomplete="email">
    <input class="auth-input" type="password" id="pw"    placeholder="Password" autocomplete="current-password">
    <button class="btn btn-primary btn-full" id="login-btn">🚀 Accedi</button>
    <p class="auth-error" id="err"></p>
    <p class="auth-switch">
      <a href="/recupero" style="color:var(--text-muted);font-weight:normal;font-size:.85rem;text-decoration:underline;">Hai dimenticato la password?</a><br><br>
      Non hai un account? <a href="/registrati">Registrati gratis →</a>
    </p>
    <div style="text-align:center;margin-top:14px;">
      <a href="/" style="color:var(--text-muted);font-size:.86rem;">← Torna al sito</a>
    </div>
  </div>
</div>
<script>
  // Se già loggato, vai al profilo
  fetch('/api/me').then(r=>r.json()).then(me => {
    if(me.logged_in) window.location.href = '/profilo';
  });
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('err');
  const go = async () => {
    err.textContent = '';
    btn.textContent = 'Verifica...';
    btn.disabled = true;
    const r = await fetch('/accedi', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('pw').value })
    });
    const d = await r.json();
    if(r.ok) {
      const next = new URLSearchParams(location.search).get('next') || '/';
      window.location.href = next;
    } else {
      err.textContent = '❌ ' + d.error;
    }
    btn.textContent = '🚀 Accedi';
    btn.disabled = false;
  };
  btn.addEventListener('click', go);
  document.addEventListener('keydown', e => { if(e.key==='Enter') go(); });
</script>
</body>
</html>
